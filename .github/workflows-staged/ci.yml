name: CI

on:
  pull_request:
    branches: [develop, stable-testing, main]
  push:
    branches: [develop, stable-testing, main]

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hook self-tests
        run: python scripts/hooks/test_hooks.py
      - name: Ruleset and CI job names agree
        run: python scripts/check_ruleset_contexts.py
      - name: Backlog artifacts are current
        run: python scripts/hooks/check_backlog_current.py
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        env:
          # no-commit-to-branch: CI legitimately checks out develop and main.
          # The toolchain hooks are skipped here because lint-api and lint-web already own
          # them, with the dependencies installed. This job owns repository hygiene only.
          SKIP: no-commit-to-branch,mypy-api,eslint-web,prettier-web,typecheck-web
        run: pre-commit run --all-files --show-diff-on-failure

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks scans history, not just the tip
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src

  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lexpert
          POSTGRES_PASSWORD: lexpert
          POSTGRES_DB: lexpert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEXPERT_DATABASE_URL: postgresql+psycopg://lexpert:lexpert@localhost:5432/lexpert_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q --cov=lexpert_api --cov-report=term-missing
      - name: Coverage summary
        if: always()
        run: |
          echo "### API coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY"

  lint-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
